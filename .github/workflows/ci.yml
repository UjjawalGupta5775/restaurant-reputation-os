name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        # Build needs many env vars to be set as non-empty strings so the
        # server/browser clients + provider adapters can initialise during
        # static-page collection. Real secrets aren't needed at build time —
        # @supabase/supabase-js v2 throws at createClient() when the key is
        # missing, which crashes any imported page. Same shape of guard in
        # the Lemon Squeezy adapter (lazy, but defensive) and the cron route.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          LEMONSQUEEZY_API_KEY: ci-placeholder
          LEMONSQUEEZY_STORE_ID: "0"
          LEMONSQUEEZY_VARIANT_ID: "0"
          LEMONSQUEEZY_WEBHOOK_SECRET: ci-placeholder
          CRON_SECRET: ci-placeholder
        run: npm run build
